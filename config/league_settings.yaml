      - [175, 199, 4]
      - [200, 224, 6]
      - [225, 249, 8]
      - [250, 274, 10]
      - [275, 299, 12]
      - [300, 324, 14]
      - [325, 349, 16]
      - [350, 374, 18]
      - [375, 399, 20]
      - [400, 424, 22]
      - [425, 449, 24]
      - [450, 474, 26]
      - [475, 499, 28]
      - [500, 524, 30]
      - [525, 549, 32]
      - [550, 574, 34]
      - [575, 599, 36]
      - [600, 624, 38]

  rushing:
    td_base: 6
    td_long_bonus: {min_yards: 11, max_yards: 100, bonus: 2}  # "RuTD of 11 to 100 Yds"
    two_point_conversion: 2
    yardage_tiers:
      - [20, 29, 2]
      - [30, 49, 3]
      - [50, 74, 5]
      - [75, 99, 7]
      - [100, 124, 9]
      - [125, 149, 11]
      - [150, 174, 13]
      - [175, 199, 15]
      - [200, 224, 17]
      - [225, 249, 19]
      - [250, 274, 21]
      - [275, 299, 23]
      - [300, 324, 25]
      - [325, 349, 27]
      - [350, 374, 29]
      - [375, 399, 31]

  receiving:
    td_base: 7
    td_long_bonus: {min_yards: 26, max_yards: 100, bonus: 2}  # "ReTD of 26 to 100 Yds"
    two_point_conversion: 2
    yardage_tiers:
      - [20, 29, 2]
      - [30, 49, 3]
      - [50, 74, 4]
      - [75, 99, 6]
      - [100, 124, 8]
      - [125, 149, 10]
      - [150, 174, 12]
      - [175, 199, 14]
      - [200, 224, 16]
      - [225, 249, 18]
      - [250, 274, 20]
      - [275, 299, 22]
      - [300, 324, 24]
      - [325, 349, 26]
      - [350, 374, 28]
      - [375, 399, 30]
    reception_tiers:
      - [2, 3, 1]
      - [4, 5, 2]
      - [6, 7, 3]
      - [8, 9, 4]
      - [10, 11, 5]
      - [12, 13, 6]
      - [14, 15, 7]
      - [16, 17, 8]
      - [18, 19, 9]
      - [20, 21, 10]
      - [22, 23, 11]

  kicking:
    fg_base: 3
    fg_distance_bonus_tiers:
      - [40, 49, 1]
      - [50, 59, 2]
      - [60, 100, 3]
    extra_point: 1
    missed_extra_point: -1

  fumbles:
    fumble_lost: -1  # "Including ST plays"
    offensive_fumble_recovery_td: 6  # OFRTD
    fumble_recovery_two_point: 2     # Fum2PK / Fum2PT

  individual_special_teams:
    # Individual (non-DST) return TDs — rare, but a WR/RB/etc. can score these
    kick_return_td: 6
    punt_return_td: 6

  defense_special_teams:
    sack: 1
    interception: 2
    fumble_recovery: 2  # DFR
    defensive_st_td: 6  # DTD - total defensive/ST TD
    blocked_field_goal: 1
    blocked_punt: 1
    blocked_extra_point: 1
    safety: 2
    st_two_point_return: 2
    st_one_point_safety: 2
    points_against_tiers:
      # NOTE: verbatim from CBS — only 3 tiers exist on the page. See
      # metadata.notes above. PA=1 and PA>=14 currently score 0 bonus.
      - [0, 0, 15]
      - [2, 6, 5]
      - [7, 13, 2]
    yards_allowed_tiers:
      # NOTE: verbatim from CBS — only 3 tiers exist on the page. See
      # metadata.notes above. Yards allowed >250 currently scores 0 bonus.
      - [0, 100, 10]
      - [101, 175, 5]
      - [176, 250, 2]

# NOT real league rules — tunable estimates this app uses to approximate
# scoring from season-total projections that don't carry per-play distance
# or per-game distribution (projection sources give season totals, not
# which TDs were long or how production was distributed across games).
# Tune here as better data becomes available; keep out of src/ so these
# stay easy to find and adjust without touching code.
estimation_assumptions:
  games_per_season: 17  # NFL regular season length; used to convert season totals to per-game averages
  long_td_share:
    # assumed share of TDs of each type that clear the long-bonus yardage
    # threshold (26yd for pass/rec, 11yd for rush)
    passing: 0.30
    rushing: 0.50
    receiving: 0.30
  fg_distance_distribution:
    # assumed share of a kicker's made FGs landing in each bonus distance
    # bucket; remainder assumed under 40 yds (no distance bonus)
    "40_49": 0.28
    "50_59": 0.10
    "60_plus": 0.01
  flex_position_splits:
    # How league-wide demand for each multi-eligible starting slot is
    # assumed to split across positions, for the value-over-replacement
    # model in src/projections.py. Real draft behavior will vary; this is
    # a starting assumption, not a prediction. Must sum to 1.0 per slot.
    WR_TE_FLEX:
      WR: 0.75
      TE: 0.25
    FLEX:
      RB: 0.40
      WR: 0.40
      TE: 0.15
      K: 0.05
    SUPERFLEX:
      # Weighted toward QB: this league's passing yardage/TD bonuses are
      # rich (up to 38 pts for 600+ pass yards, TD bonus for 26+ yd
      # scores), which typically makes QB the highest-value superflex fill
      # even before accounting for QB scarcity relative to demand.
      QB: 0.55
      RB: 0.20
      WR: 0.20
      TE: 0.05

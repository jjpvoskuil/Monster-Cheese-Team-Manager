# Maniac Football League — Monster Cheese
#
# SOURCE OF TRUTH for all league/roster/scoring rules used by this app.
# Everything in src/ reads from this file. Edit config, not code, when a
# league setting changes.
#
# Captured directly from the live CBS rules page (logged-in session):
#   https://maniacfl.football.cbssports.com/rules
# Captured: 2026-08-24, by Claude (Cowork session), re-verifying and
# superseding an earlier capture from a prior session. Re-check this page
# before trusting anything here deep into draft prep — commissioners can
# change settings.

metadata:
  source_url: "https://maniacfl.football.cbssports.com/rules"
  captured_at: "2026-08-24"
  notes: >
    Defensive Points-Against and Yards-Allowed tables are transcribed
    EXACTLY as CBS renders them, including their apparent gaps (e.g. PA=1
    has no listed tier). This was independently re-verified on 2026-08-24
    and is NOT a text-extraction artifact — the CBS page itself only lists
    3 tiers for each of these two tables. Values outside a listed tier are
    treated as 0 bonus/penalty points by this app. Recommend the league
    commissioner confirm whether more tiers exist in the CBS admin scoring
    editor (not visible from a regular manager's rules-page view).

league:
  name: "Maniac Football League"
  team_name: "Monster Cheese"
  url: "https://maniacfl.football.cbssports.com"
  teams: 10
  divisions: 2
  entry_fee_usd: 175.00

draft:
  format: "Live Draft"
  order_type: "Snake"
  date_time: "2026-08-30T14:30:00-04:00"  # 8/30/26 2:30pm ET
  rounds: 22
  team_order:  # round-1 snake order, refreshed by scripts/fetch_draft_order.py
    - "Mississippi Swamp Ass"
    - "Aces High"
    - "THE DEMONS"
    - "Pimp Daddy"
    - "Legion of Doom"
    - "Mojo"
    - "Salty Dogs"
    - "Monster Cheese"
    - "Buckhorns"
    - "Ball Busters"
  seconds_per_pick: 70
  autopick_on_expire: true  # "draft robot" fills any team that lets the clock expire
  reverse_last_n_rounds: 2
  # Per league-manager feedback (2026-08-26), the final 2 rounds don't
  # just continue the normal alternating snake -- the FIRST of those 2
  # rounds is forced to reverse order (team_order's last team, "#10",
  # picks first), then it snakes normally into the actual last round.
  # With 22 total rounds this genuinely flips both rounds relative to
  # what uninterrupted alternation would have given (round 21 would
  # otherwise be forward, round 22 reverse) -- see
  # src/draft_state.py's _round_is_forward() docstring for the exact
  # mechanics. Not independently confirmed against CBS's UI/rules page
  # this session -- taken as stated by the league manager.

roster:
  # Active starting lineup slots (12 total), from the league Constitution
  # (the "Roster Limits" ACTIVE MIN/MAX table on the rules page is an
  # aggregate view of these same slots and does not name them individually).
  starters:
    - slot: QB
      count: 1
      eligible: [QB]
    - slot: RB
      count: 3
      eligible: [RB]
    - slot: WR_TE_FLEX
      count: 3
      eligible: [WR, TE]
    - slot: TE
      count: 1
      eligible: [TE]
    - slot: K
      count: 1
      eligible: [K]
    - slot: SUPERFLEX
      count: 1
      eligible: [QB, RB, WR, TE]
      # ASSUMPTION: CBS's constitution literally says "Any position Player"
      # for this slot. Standard fantasy convention (and the only way K/DST
      # here would make strategic sense) is offensive skill positions only.
      # Treating as QB/RB/WR/TE. Flag to re-confirm if it matters late.
    - slot: FLEX
      count: 1
      eligible: [RB, WR, TE, K]
    - slot: DST
      count: 1
      eligible: [DST]
  total_starters: 12
  bench_min: 0
  bench_max: 15
  roster_total_min: 12
  roster_total_max: 27

  # Aggregate active-roster min/max per position, as CBS's "Roster Limits"
  # table reports it (informational cross-check against the slot list above)
  #
  # DST and TE updated 2026-08-27 -- the real "Maniac Football League
  # Draft Sheet" the league manager uploaded that day requires 2 DEF and
  # allows TE beyond the 1 dedicated slot (its "WR/TE" bucket, 5 slots,
  # is explicitly WR-or-TE) by round 20 -- see draft_requirements below.
  # That directly conflicted with this table's original DST max of 1 and
  # TE max of 1 (both captured 2026-08-24 from CBS's rules page, before
  # the draft sheet existed) -- raised both here so the redundancy-cap
  # mechanism in src/pick_suggestion.py doesn't block satisfying the real
  # requirement. NOT independently re-verified against CBS's UI since --
  # flagging this specifically: if CBS's platform genuinely, technically
  # enforces "at most 1 DST ever rostered" as a hard constraint (as
  # opposed to this just being a stale/imprecise cross-check number),
  # drafting a 2nd DEF per the draft sheet would be impossible in
  # practice, not just suboptimal, and the draft sheet's "2 DEF" would
  # need a different interpretation. Re-confirm on CBS if it matters
  # before draft day.
  position_active_limits:
    QB: {min: 1, max: 2}
    RB: {min: 3, max: 5}
    TE: {min: 1, max: 2}
    WR_TE: {min: 3, max: 5}
    K: {min: 1, max: 3}
    DST: {min: 1, max: 2}

  validation:
    illegal_roster_score: 0  # "Illegal rosters score zero points in standings"
    # CBS Constitution text (verbatim, genuinely ambiguous — see interpretation
    # below): "You must start a combination of 3 WR's/TE's plus an additional
    # TE ... Thus if you only start 2 wr's and a TE your roster is not legal
    # ... the website could not be configured to show this as an illegal
    # line-up."
    # INTERPRETATION (matches examples given: 2 WR + 2 TE = legal,
    # 2 WR + 1 TE = illegal): across the 4 combined WR/TE-eligible starting
    # slots (the 3-player WR_TE_FLEX group + the 1 dedicated TE slot), at
    # least 2 of those 4 players must be TEs. CBS's own roster-legality
    # checker does NOT enforce this (explicitly stated on the rules page),
    # so this app must enforce it itself in any lineup-legality check.
    min_te_across_te_eligible_slots: 2
    te_eligible_slot_names: [WR_TE_FLEX, TE]

scoring:
  # All yardage/reception/points-allowed/yards-allowed tables below are
  # TIERED SCORING: a player's total in that stat for a single game maps to
  # a single points value from the matching tier (not a flat per-unit rate).
  # Tiers are listed [min, max, points]. A value falling in the gap between
  # two tiers, or below the lowest tier, scores 0 for that table. A value
  # above the highest listed tier is out of the range CBS's UI showed us;
  # src/scoring.py extrapolates using the trailing tier's point-per-unit
  # slope (documented there as an estimate) rather than treating it as 0,
  # since real single-game performances can exceed these tops.

  passing:
    td_base: 6
    td_long_bonus: {min_yards: 26, max_yards: 100, bonus: 2}  # "PaTD of 26 to 100 Yds"
    interception_thrown: -3
    two_point_conversion: 2
    yardage_tiers:
      - [150, 174, 2]
      - [175, 199, 4]
      - [200, 224, 6]
      - [225, 249, 8]
      - [250, 274, 10]
      - [275, 299, 12]
      - [300, 324, 14]
      - [325, 349, 16]
      - [350, 374, 18]
      - [375, 399, 20]
      - [400, 424, 22]
      - [425, 449, 24]
      - [450, 474, 26]
      - [475, 499, 28]
      - [500, 524, 30]
      - [525, 549, 32]
      - [550, 574, 34]
      - [575, 599, 36]
      - [600, 624, 38]

  rushing:
    td_base: 6
    td_long_bonus: {min_yards: 11, max_yards: 100, bonus: 2}  # "RuTD of 11 to 100 Yds"
    two_point_conversion: 2
    yardage_tiers:
      - [20, 29, 2]
      - [30, 49, 3]
      - [50, 74, 5]
      - [75, 99, 7]
      - [100, 124, 9]
      - [125, 149, 11]
      - [150, 174, 13]
      - [175, 199, 15]
      - [200, 224, 17]
      - [225, 249, 19]
      - [250, 274, 21]
      - [275, 299, 23]
      - [300, 324, 25]
      - [325, 349, 27]
      - [350, 374, 29]
      - [375, 399, 31]

  receiving:
    td_base: 7
    td_long_bonus: {min_yards: 26, max_yards: 100, bonus: 2}  # "ReTD of 26 to 100 Yds"
    two_point_conversion: 2
    yardage_tiers:
      - [20, 29, 2]
      - [30, 49, 3]
      - [50, 74, 4]
      - [75, 99, 6]
      - [100, 124, 8]
      - [125, 149, 10]
      - [150, 174, 12]
      - [175, 199, 14]
      - [200, 224, 16]
      - [225, 249, 18]
      - [250, 274, 20]
      - [275, 299, 22]
      - [300, 324, 24]
      - [325, 349, 26]
      - [350, 374, 28]
      - [375, 399, 30]
    reception_tiers:
      - [2, 3, 1]
      - [4, 5, 2]
      - [6, 7, 3]
      - [8, 9, 4]
      - [10, 11, 5]
      - [12, 13, 6]
      - [14, 15, 7]
      - [16, 17, 8]
      - [18, 19, 9]
      - [20, 21, 10]
      - [22, 23, 11]

  kicking:
    fg_base: 3
    fg_distance_bonus_tiers:
      - [40, 49, 1]
      - [50, 59, 2]
      - [60, 100, 3]
    extra_point: 1
    missed_extra_point: -1

  fumbles:
    fumble_lost: -1  # "Including ST plays"
    offensive_fumble_recovery_td: 6  # OFRTD
    fumble_recovery_two_point: 2     # Fum2PK / Fum2PT

  individual_special_teams:
    # Individual (non-DST) return TDs — rare, but a WR/RB/etc. can score these
    kick_return_td: 6
    punt_return_td: 6

  defense_special_teams:
    sack: 1
    interception: 2
    fumble_recovery: 2  # DFR
    defensive_st_td: 6  # DTD - total defensive/ST TD
    blocked_field_goal: 1
    blocked_punt: 1
    blocked_extra_point: 1
    safety: 2
    st_two_point_return: 2
    st_one_point_safety: 2
    points_against_tiers:
      # NOTE: verbatim from CBS — only 3 tiers exist on the page. See
      # metadata.notes above. PA=1 and PA>=14 currently score 0 bonus.
      - [0, 0, 15]
      - [2, 6, 5]
      - [7, 13, 2]
    yards_allowed_tiers:
      # NOTE: verbatim from CBS — only 3 tiers exist on the page. See
      # metadata.notes above. Yards allowed >250 currently scores 0 bonus.
      - [0, 100, 10]
      - [101, 175, 5]
      - [176, 250, 2]

# NOT real league rules — tunable estimates this app uses to approximate
# scoring from season-total projections that don't carry per-play distance
# or per-game distribution (projection sources give season totals, not
# which TDs were long or how production was distributed across games).
# Tune here as better data becomes available; keep out of src/ so these
# stay easy to find and adjust without touching code.
estimation_assumptions:
  games_per_season: 17  # NFL regular season length; used to convert season totals to per-game averages
  long_td_share:
    # assumed share of TDs of each type that clear the long-bonus yardage
    # threshold (26yd for pass/rec, 11yd for rush)
    passing: 0.30
    rushing: 0.50
    receiving: 0.30
  fg_distance_distribution:
    # assumed share of a kicker's made FGs landing in each bonus distance
    # bucket; remainder assumed under 40 yds (no distance bonus)
    "40_49": 0.28
    "50_59": 0.10
    "60_plus": 0.01
  flex_position_splits:
    # How league-wide demand for each multi-eligible starting slot is
    # assumed to split across positions, for the value-over-replacement
    # model in src/projections.py. Real draft behavior will vary; this is
    # a starting assumption, not a prediction. Must sum to 1.0 per slot.
    WR_TE_FLEX:
      WR: 0.75
      TE: 0.25
    FLEX:
      RB: 0.40
      WR: 0.40
      TE: 0.15
      K: 0.05
    SUPERFLEX:
      # 100% QB, per league-manager feedback (2026-08-27): "while we don't
      # have to start 2 QBs it is always the best choice if 2 are available
      # on that game day" -- treat a 2nd QB here as a mandatory lineup
      # choice whenever one is rosterable, not just a strong preference.
      # Previously 0.90/0.04/0.04/0.02 (a small deliberate buffer against
      # modeling this slot as 100% certain); revised to 1.0 straight QB per
      # this explicit instruction. This league's passing yardage/TD bonuses
      # are rich enough (up to 38 pts for 600+ pass yards, bonus for 26+ yd
      # scores) that a good QB essentially always beats a good RB/WR/TE
      # here -- every team should be expected to start 2 QBs (1 dedicated +
      # 1 superflex) every week. Tune back down if draft-day behavior looks
      # different.
      QB: 1.0
      RB: 0.0
      WR: 0.0
      TE: 0.0
  position_early_round_discount:
    # Per league-manager feedback (2026-08-26): "kickers and defenses are
    # pretty much a dime a dozen, rarely worth taking before round 17."
    # Used by src/pick_suggestion.py to softly discount (NOT block) K/DST
    # in the Suggested Pick panel before `before_round` -- see
    # _early_round_discount()'s docstring. You can still draft either by
    # hand any time; this only affects the algorithm's own recommendation.
    #
    # UPDATE (2026-08-27): the real requirement is now confirmed and wired
    # in below -- round_based_fill_targets' K/DEF entries (2 each by round
    # 20, from the real "Maniac Football League Draft Sheet"). That
    # correctly overrides this discount once its shared round-20 deadline
    # group runs out of slack (src/pick_suggestion.py's
    # _round_based_quota_positions()) -- confirmed via Monte Carlo
    # (2026-08-27) that K/DEF still get force-prioritized as needed even
    # while this early-round discount would otherwise apply; see that
    # function's and suggest_position()'s docstrings for why the
    # must-fill override tier deliberately does NOT also exclude
    # early-round-discounted positions the way the ordinary ranking path
    # does (tried it, a same-seed sim comparison showed it makes things
    # worse -- a real deadline is worth overriding a soft timing
    # preference for).
    K: {before_round: 17, multiplier: 0.2}
    DST: {before_round: 17, multiplier: 0.2}

  # Hard "cannot come before round R" floor for the league manager's OWN
  # team only (Monster Cheese) -- distinct from position_early_round_discount
  # above, which is a soft VALUE squash that still falls back to K/DST when
  # nothing else is available. This is an absolute exclusion from
  # recommendation with (almost) no fallback -- see
  # src/pick_suggestion.py's _not_before_round_blocked() and
  # suggest_position()'s handling. Added 2026-08-28 per league-manager
  # feedback: "For our team only, add a rule that the second defense and
  # the 2 kickers cannot come before round 17." `starting_at_count`
  # controls which occurrence of this position the floor first applies to
  # (1 = every pick of this position is blocked before the floor round;
  # 2 = only the 2nd-and-later is blocked, leaving the 1st unrestricted)
  # -- K's floor applies to both kickers (starting_at_count: 1), DST's
  # floor applies only starting at the 2nd (starting_at_count: 2, leaving
  # the 1st DST free to be drafted whenever value/need/scarcity says so).
  # Deliberately scoped to MY OWN recommendation engine only -- opponents
  # are modeled separately via historical draft tendencies
  # (src/draft_tendencies.py), not this module, so this floor has no
  # effect on how opponent behavior is simulated/predicted.
  position_not_before_round:
    K: {not_before_round: 17, starting_at_count: 1}
    DST: {not_before_round: 17, starting_at_count: 2}

  round_based_fill_targets:
    # "Must have N players eligible for this category by round R" targets
    # that src/pick_suggestion.py's suggest_position() force-prioritizes
    # (via the grouped-by-deadline urgency check in
    # _round_based_quota_positions()) once you're down to your last
    # chance(s) to hit them as a GROUP, and that my_position_need() also
    # feeds into the ongoing value/need/scarcity composite as soft demand
    # all draft long, not just at the deadline -- see both functions'
    # docstrings.
    #
    # SHAPE (changed 2026-08-27 from a dict keyed by position to this
    # list, to support multi-eligible categories like "WR or TE" and
    # "RB, WR, or TE" that a single position key can't represent):
    #   - slot: <unique label, same spirit as roster.starters' slot names>
    #     eligible: [<positions that count toward this category>]
    #     count: <how many needed>
    #     by_round: <deadline round, inclusive>
    #
    # Entries below are ALL real CBS league requirements now (source: the
    # "Maniac Football League Draft Sheet" the league manager uploaded
    # 2026-08-27 -- 10 rows x 2 columns of by-round-20 requirements, plus
    # 2 unconstrained "Bonus Round" picks at 21/22 that are deliberately
    # NOT modeled here since "any position" imposes no real constraint):
    #   QB, QB, K, K, DEF, DEF, RB x5, WR/TE x5, "RB/WR/TE" x1,
    #   "TE (Mandatory)" x1, "Any Position" x2 = 20 items by round 20.
    # Read via soffice+pdftoppm (pandoc's markdown conversion collapsed
    # the two-column table into ambiguous flat text). Interpreted as a
    # required ROSTER COMPOSITION by round 20 (not a literal pick-by-pick
    # order -- taking K/DEF in the first few picks, as the table's row
    # position would literally suggest, would contradict everything
    # established about K/DST early-round value this session), per the
    # league manager's own framing: "All the positions at the top must be
    # filled by the end of round 20 and then 21 and 22 can be any
    # position."
    #
    # NOTE: this doc's "2 DEF" and flexible-TE requirement is what
    # motivated raising roster.position_active_limits' DST/TE max above
    # (see that block's comment for the unresolved DST=1-vs-2 conflict
    # against the separate CBS rules-page capture -- still needs
    # re-confirming on CBS before draft day).
    - slot: QB
      eligible: [QB]
      count: 2
      by_round: 6
      # Kept at the empirically-tuned round 6 (tighter than the
      # requirement doc's implied round-20 deadline) -- per league-manager
      # feedback (2026-08-26): "not having 2 [QBs] in the first 7 rounds
      # or so would be a disaster." A 25-trial-per-setting Monte Carlo
      # sweep (2026-08-26, see SESSION_NOTES) tried by_round in
      # {2,3,4,5,6,7,9,12} plus a count=3 variant: results improved
      # steadily from round 12 down through round 6 (avg league rank
      # 3.52 -> 1.64 of 10, top-3 rate 48% -> 96%), FLATTENED across 4-6,
      # then started giving a little back at 3-2 (forcing QB2 too early
      # costs elite RB/WR value). Round 6 sits in that flat sweet-spot
      # band with more schedule buffer than 4-5. The requirement doc's
      # own round-20 deadline for QB is far looser than this and is
      # superseded by this tighter, simulation-backed target.
    - slot: K
      eligible: [K]
      count: 2
      by_round: 20
    - slot: DEF
      eligible: [DST]
      count: 2
      by_round: 20
    - slot: RB_REQUIREMENT
      eligible: [RB]
      count: 5
      by_round: 20
    - slot: WR_TE_REQUIREMENT
      eligible: [WR, TE]
      count: 5
      by_round: 20
    - slot: RB_WR_TE_REQUIREMENT
      eligible: [RB, WR, TE]
      count: 1
      by_round: 20
    - slot: TE_MANDATORY
      eligible: [TE]
      count: 1
      by_round: 20
    - slot: ANY_POSITION_REQUIREMENT
      eligible: [QB, RB, WR, TE, K, DST]
      count: 2
      by_round: 20
      # Included for accurate slot-budget bookkeeping in the grouped
      # round-20 urgency check (it's still 2 of your 20 by-round-20 picks)
      # even though, being eligible for literally anything, it never by
      # itself forces a specific position.
